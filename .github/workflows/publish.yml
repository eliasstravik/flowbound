# Publishes a tagged Flowbound release with npm provenance. See docs/publish.md.
name: publish
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: read
  id-token: write # npm provenance, and npm's trusted publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: The tag is the version
        run: |
          v=$(node -p 'require("./package.json").version')
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::The tag is $GITHUB_REF_NAME but package.json says $v."; exit 1; }
      - run: npm ci
      - run: npm run lint
      - run: npm run types
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          # Used for the first release only. Trusted publishing uses the workflow's OIDC identity afterwards.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
