# Publishes the flowbound package to npm, with provenance, when a release tag like v0.1.0 is pushed. Nothing else
# starts it. While package.json says "private": true it stops before publishing, with a plain message.
# How to release, and the one line to remove when it is time: docs/publish.md.
name: publish
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: read
  id-token: write # npm provenance, and npm's trusted publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Not while private
        run: |
          if [ "$(node -p 'require("./package.json").private === true')" = true ]; then
            echo "::error::package.json still says \"private\": true, so nothing is published. See docs/publish.md."
            exit 1
          fi
      - name: The tag is the version
        run: |
          v=$(node -p 'require("./package.json").version')
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::The tag is $GITHUB_REF_NAME but package.json says $v."; exit 1; }
      - run: npm ci
      - run: npm run lint
      - run: npm run types
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
