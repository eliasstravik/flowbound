name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run types
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash staging/build.sh --check
      - run: bash scripts/build-hosted.sh
      - run: bash scripts/build-hosted.sh
        env:
          FLOWBOUND_DEMO: "1"
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
  check:
    runs-on: ubuntu-latest
    needs: [types, workflows, tests]
    if: always()
    steps:
      - run: test "${{ needs.types.result }} ${{ needs.workflows.result }} ${{ needs.tests.result }}" = "success success success"
