<div data-view></div>
<script>
// Runs: every run, newest first, 50 at a time; a run's page with its numbers, Stop, Open in workflow UI and every row;
// tap a row for its steps on a time axis. A run that waits for a yes is a run too: its page asks the question.
fb.page("/runs", async (root, params) => {
  const { h, call, num, ui } = fb
  const view = root.querySelector("[data-view]")
  const show = (...kids) => view.replaceChildren(...kids.flat().filter(Boolean))
  /** tam-mapping/nordics -> Tam mapping / Nordics: a folder's path as people read it. */
  const folderName = (f) => (f ? f.split("/").map((p) => p.replace(/[-_]+/g, " ").replace(/^./, (c) => c.toUpperCase())).join(" / ") : "")
  /** "today 08:00", "yesterday", "26 Nov, 18:41": when a run was asked for or began. */
  const whenOf = (at) => {
    const days = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(at).setHours(0, 0, 0, 0)) / 86_400_000)
    return days === 0 ? `today ${fb.when(at)}` : days === 1 ? "yesterday" : fb.when(at)
  }
  /** A run's name on its page: its workflow and its day, "Find sales heads, 27 Nov". */
  const dated = (r) => `${r.title}, ${new Date(r.at).toLocaleDateString("en-GB", { day: "numeric", month: "short", ...(new Date(r.at).getFullYear() === new Date().getFullYear() ? {} : { year: "numeric" }) })}`
  /** Money as the page says it: "$0" for nothing, "$0.21", "$5.00". */
  const said = (text) => String(text).replace(/^\$0\.00\b/, "$0")
  const pager = (page, more, key) => {
    const turn = (label, to, off) => h("button", { class: "btn", "data-variant": "outline", "data-size": "sm", type: "button", disabled: off, onclick: () => fb.stay({ [key]: to > 1 ? to : null }) }, label)
    return page > 1 || more ? h("div", { class: "pager" }, h("p", { class: "num" }, `Page ${num(page)}`), h("div", { class: "actions" }, turn("Previous", page - 1, page <= 1), turn("Next", page + 1, !more))) : null
  }

  // ---- every run, newest first ----
  if (!params.run) {
    const page = Math.max(1, Math.floor(Number(params.page)) || 1)
    const got = await call("runs", { offset: (page - 1) * 50, limit: 51 })
    const runs = got.slice(0, 50)
    if (!runs.length && page === 1) return show(ui.head({ title: "Runs" }), h("p", { class: "text-muted-foreground" }, "No runs yet."))
    show(
      ui.head({ title: "Runs" }),
      runs.length
        ? h("ul", { class: "rows sm:grid-cols-[minmax(0,1fr)_auto_auto]", role: "list" },
            runs.map((r) => h("li", {}, ui.link("/runs", { run: r.run }, [
              h("span", {}, r.title, r.folder ? h("span", { class: "text-muted-foreground ml-3 font-normal" }, folderName(r.folder)) : null),
              h("span", { class: "meta" },
                h("span", { "data-live": `state${r.run}` }, ui.runState(r)),
                h("span", { class: "sm:text-muted-foreground! text-xs", title: new Date(r.at).toLocaleString() }, whenOf(r.at))),
            ]))))
        : h("p", { class: "text-muted-foreground" }, "No older runs."),
      pager(page, got.length > 50, "page"))
    if (runs.some((r) => r.state === "running")) fb.poll(3000)
    return
  }

  // ---- one run ----
  const rowsPage = Math.max(1, Math.floor(Number(params.rows)) || 1)
  const r = await call("runs", { run: Number(params.run), rows: rowsPage })
  const open = params.row ? Number(params.row) : null
  const steps = open && r.rowsPage.list.some((x) => x.row === open) ? await call("steps", { run: r.run, row: open }).catch(() => null) : null
  const waits = !!r.asks
  const name = dated(r)

  /** The yes it waits for: the question, what the try-out did, and that the yes goes through the agent. No button. */
  const asks = waits
    ? h("section", { class: "decision", "data-tone": "warn", "aria-label": "Waits for a yes", "data-live": "asks" },
        h("p", { class: "font-medium" }, r.asks.short || r.asks.question),
        h("p", { class: "text-muted-foreground" },
          r.asks.kind === "more" && r.why ? `${r.why} ` : "",
          r.asks.tried ? `The ${num(r.asks.tried.rows)}-row try-out found ${num(r.asks.tried.found)} ${r.asks.tried.into.replace(/_/g, " ")} for ${said(fb.money(r.asks.tried.usd))}. ` : "",
          "Tell your agent yes, and it passes it on."))
    : null
  const stats = ui.stats([
    ["Done", `${num(r.rows.done)} of ${num(r.rows.of)}`],
    ["Failed", num(r.rows.failed)],
    ["Spent", said(r.spent.text)],
    [r.state === "waiting" ? "Asked" : "Started", `${fb.when(r.at)} · ${r.how}`],
  ], { "data-live": "stats" })

  // Stop is the only thing this page does: it cancels the run at once (for one that waits, it is the no).
  const canStop = ["running", "waiting", "paused"].includes(r.state) && fb.can("member") && fb.supports("stop")
  const stop = canStop ? h("button", { class: "btn", "data-variant": "outline", type: "button" }, "Stop") : null
  if (stop) stop.onclick = () => fb.act(stop, async () => (await call("stop", { run: r.run }), fb.say("Stopped."), fb.redraw()))
  const ways = stop || r.open
    ? h("div", { class: "actions flex flex-wrap gap-2" }, stop, r.open ? h("a", { class: "btn", "data-variant": "outline", href: r.open, target: "_blank", rel: "noreferrer" }, "Open in workflow UI", ui.icon("arrow-up-right")) : null)
    : null

  /** A time on the axis: "0 ms", "400 ms", "1.2 s", "3 min". */
  const ms = (n) => (n < 1000 ? `${Math.round(n)} ms` : n < 60_000 ? `${(n / 1000).toFixed(n < 10_000 ? 1 : 0)} s` : `${Math.round(n / 60_000)} min`)
  const trace = (s) => {
    if (!s || !s.steps.length) return h("div", { class: "trace" }, h("p", { class: "text-muted-foreground py-1" }, s && s.reason ? s.reason : "No steps were written down for this row."))
    const span = Math.max(s.ms, 1)
    return h("div", { class: "trace", role: "list", "aria-label": "Its steps" },
      s.steps.map((x) => h("div", { class: "step", role: "listitem" },
        h("div", {}, h("div", {}, x.name), h("div", { class: "sub" }, ui.linked(x.text))),
        h("div", { class: "bar", title: ms(x.ms) }, h("i", { "data-tone": x.state === "failed" ? "bad" : x.state === "running" ? "running" : null, style: `--l:${(100 * x.at) / span}%;--w:${Math.max((100 * x.ms) / span, 1)}%` })))),
      h("div", { class: "axis", "aria-hidden": "true" }, h("span", {}, "0 ms"), h("span", {}, ms(span / 2)), h("span", {}, ms(span))))
  }
  const STATE = { done: ["done", "Done"], failed: ["failed", "Failed"], running: ["running", "Running"] }
  const rows = r.rowsPage.list
  const table = rows.length
    ? h("div", { class: "table-container", tabindex: "0", role: "region", "aria-label": "Rows", "data-live": "rows" },
        h("table", { class: "table" },
          h("thead", {}, h("tr", {}, ["Row", "Status", "Cost"].map((t) => h("th", { scope: "col" }, t)))),
          h("tbody", {}, rows.flatMap((x) => {
            const on = open === x.row
            const toggle = () => fb.stay({ row: on ? null : x.row })
            return [
              h("tr", { class: "tap", onclick: toggle },
                h("td", {}, h("button", { type: "button", "aria-expanded": on ? "true" : "false", onclick: (e) => (e.stopPropagation(), toggle()) }, x.name)),
                h("td", {}, ui.status(...(STATE[x.state] || [x.state]))),
                h("td", { class: "num" }, x.cost)),
              on ? h("tr", {}, h("td", { colspan: "3", class: "trace-cell" }, trace(steps))) : null,
            ]
          }))))
    : null

  show(
    ui.path([["/runs", {}, "Runs"]], name),
    ui.head({ title: name, status: h("span", { "data-live": "state" }, ui.runState(r, true)) }),
    asks,
    // Failed, stopped and paused runs say why in plain words.
    r.why && !waits ? ui.note(r.why, r.state === "paused" ? "warn" : r.state === "stopped" && r.code !== "person" ? "bad" : null, { "data-live": "why" }) : null,
    stats,
    ways,
    h("section", { class: "flex flex-col gap-3" },
      h("h2", {}, "Rows"),
      table || h("p", { class: "text-muted-foreground" }, "No rows run yet."),
      table ? h("p", { class: "sub" }, "Tap a row for its steps.") : null,
      pager(rowsPage, rowsPage < r.rowsPage.of, "rows")))
  if (r.state === "running") fb.poll(2000)
  else if (fb.embedded && waits) fb.poll(6000)
})
</script>
