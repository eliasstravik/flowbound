<div data-view></div>
<script>
fb.page("/tables", async (root, params) => {
  const { h, call, num, ui } = fb
  const view = root.querySelector("[data-view]")
  /** tam-mapping -> Tam mapping: a folder's name as the Workflows page says it. */
  const named = (slug) => slug.replace(/[-_]+/g, " ").replace(/^./, (c) => c.toUpperCase())
  const compact = fb.compact()

  // The table list, grouped as the workflows are: each folder (a play), then tables in no folder, then Flowbound's own.
  const d = await call("data")
  if (!d.tables.length && !params.table) return view.replaceChildren(ui.head({ title: "Data" }), h("p", { class: "text-muted-foreground" }, "No tables yet. A workflow's results land here."))
  const folders = [...new Set(d.tables.map((t) => t.folder).filter(Boolean))].sort((a, b) => a.localeCompare(b))
  const groups = [
    ...folders.map((f) => [f.split("/").map(named).join(" / "), d.tables.filter((t) => t.folder === f)]),
    [folders.length ? "Not in a folder" : "Yours", d.tables.filter((t) => !t.folder)],
    ["Flowbound's own", d.own.map((t) => ({ name: t.name, short: t.short, rows: t.rows }))],
  ].filter(([, ts]) => ts.length)
  const listed = groups.flatMap(([, ts]) => ts)
  const name = params.table || listed[0].name
  const here = listed.find((t) => t.name === name)
  const label = here?.short || name

  // One page of the open table: the address keeps the page, the search and the order.
  const size = compact ? 5 : 50
  const page = Math.max(1, Math.floor(Number(params.page)) || 1)
  const t = await call("table", { name, limit: size, offset: (page - 1) * size, search: params.q || undefined, sort: params.sort || undefined, desc: params.desc ? true : undefined })
  const rows = ui.grid(t, { page, size, open: d.open, label })

  if (compact) return view.replaceChildren(ui.head({ title: label, mono: true, sub: `${num(t.total)} rows, ${t.origin}` }), ...rows)

  const list = h("nav", { class: "tlist", "aria-label": "Tables", id: "tables-list" },
    groups.map(([group, ts]) => [
      h("h2", {}, group),
      ts.map((x) => ui.link("/tables", { table: x.name }, [h("span", {}, x.short || x.name), h("span", {}, num(x.rows))], { "aria-current": x.name === name ? "page" : null })),
    ]))
  // On a phone: the open table's name on top; tap it for the list.
  const pick = h("button", { class: "btn tpick", "data-variant": "outline", type: "button", "aria-expanded": "false", "aria-controls": "tables-list" }, label, ui.icon("chevron-down"))
  pick.onclick = () => {
    const open = !list.hasAttribute("data-open")
    list.toggleAttribute("data-open", open)
    pick.setAttribute("aria-expanded", String(open))
  }
  view.replaceChildren(ui.head({ title: "Data" }), pick, h("div", { class: "dsplit" }, list, h("div", {}, ...rows)))
  fb.title(`${label} · Data`)
})
</script>
