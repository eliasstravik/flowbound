<div data-view></div>
<script>
// Changes: what is saved here and not live yet, reached from "N changes not live · See them" under the menu.
// Nothing is published from this page: the person asks their agent to publish.
fb.page("/changes", async (root, params) => {
  const { h, call, ui } = fb
  const view = root.querySelector("[data-view]")
  const status = (change) => {
    if (change.state === "published") return ui.status("done", "Published")
    if (change.state === "closed") return ui.status("stopped", "Closed")
    if (change.checks.some((check) => check.state === "failed")) return ui.status("failed", "Checks failed")
    if (change.blocked) return ui.status("waiting", "Needs attention")
    if (change.checks.length && change.checks.every((check) => check.state === "passed")) return ui.status("done", "Ready to publish")
    return ui.status("waiting", "Checking")
  }
  const names = { types: "Types", workflows: "Workflow check", tests: "Tests" }
  if (!params.id) {
    const { changes, setup } = await call("workflow-changes", {})
    const head = ui.head({ title: "Changes", sub: "Saved here, not live yet. Ask your agent to publish them." })
    if (setup) return view.replaceChildren(head, ui.note(setup, "warn"))
    if (!changes.length) return view.replaceChildren(head, h("p", { class: "text-muted-foreground" }, "Nothing waiting to go live."))
    return view.replaceChildren(
      head,
      ui.table(
        ["Change", "By", "When"],
        changes.map((change) => [
          h("td", {}, ui.link("/changes", { id: change.id }, change.title, { class: "font-medium no-underline hover:underline" }), h("span", { class: "text-muted-foreground block" }, status(change))),
          change.by || "",
          change.at ? h("span", { title: new Date(change.at).toLocaleString() }, fb.ago(change.at)) : "",
        ]),
        { label: "Changes not live" },
      ),
    )
  }

  const change = await call("workflow-change", { id: params.id })
  const external = (url, title) => h("a", { href: url, class: "btn", "data-variant": "outline", rel: "noopener", target: "_blank" }, title, ui.icon("arrow-up-right"))
  const refresh = h("button", { class: "btn", type: "button", "data-variant": "outline" }, "Refresh")
  refresh.onclick = () => fb.act(refresh, () => fb.redraw())
  view.replaceChildren(...[
    ui.head({ title: change.title, back: ["/changes", "All changes"], status: status(change), sub: [change.by ? `By ${change.by}` : null, change.at ? fb.ago(change.at) : null].filter(Boolean).join(" · ") || null }),
    change.blocked ? ui.note(change.blocked, "warn") : null,
    change.state === "open" ? h("p", { class: "text-muted-foreground" }, "Ask your agent to publish it.") : null,
    change.state === "open" ? h("section", { class: "flex flex-col gap-3 max-w-2xl" },
      h("h2", {}, "Checks"),
      h("ul", { class: "todo", role: "list" }, ...change.checks.map((check) => h("li", { class: "flex items-center justify-between gap-3 py-2 border-b" },
        check.url ? h("a", { href: check.url, class: "link", rel: "noopener" }, names[check.name] || check.name) : h("span", {}, names[check.name] || check.name),
        ui.status(check.state === "passed" ? "done" : check.state, { waiting: "Waiting", passed: "Passed", failed: "Failed" }[check.state]),
      ))),
    ) : null,
    h("div", { class: "actions" }, ...[
      change.preview ? external(change.preview, "Open preview") : null,
      change.pull ? external(change.pull, "Open pull request") : null,
      change.state === "open" ? refresh : null,
    ].filter(Boolean)),
  ].filter(Boolean))
})
</script>
