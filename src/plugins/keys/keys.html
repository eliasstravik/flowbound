<div data-view></div>
<script>
// Connections: one list of keys, each a name the person chose and a secret key, with what uses it, Set or Missing,
// and Change. Add connection asks only for a name and a key. Keys are typed only here, never in a chat.
fb.page("/keys", async (root) => {
  const { h, call, ui } = fb
  const view = root.querySelector("[data-view]")
  const [{ connections }, flows] = await Promise.all([call("keys"), call("workflows").catch(() => [])])
  // Which workflows reach each key: through the cards that take it, read from each file's use("..."). Nothing is declared.
  const usedBy = (c) => flows.filter((w) => (w.uses || []).some((u) => c.cards.includes(u))).map((w) => w.title)
  const words = (names) => (names.length < 3 ? names.join(" and ") : `${names.slice(0, -1).join(", ")} and ${names.at(-1)}`)
  // What stops a workflow comes first: a missing key a workflow uses. Then the other missing ones, then the set ones.
  const rank = (c) => (c.hasKey ? 2 : usedBy(c).length ? 0 : 1)
  connections.sort((a, b) => rank(a) - rank(b))
  const may = !fb.embedded && fb.can("admin")
  const head = ui.head({ title: "Connections", sub: "Keys your workflows use, each with a name you choose. Never typed in a chat; your agent uses them and never sees them." })

  /** The box for a key: a new one (a name and a key) or one already named (its key only). */
  const panel = h("div", { hidden: true })
  const open = (c) => {
    const name = h("input", { class: "input font-mono", type: "text", name: "name", autocomplete: "off", spellcheck: "false", required: true, placeholder: "MY_SERVICE_KEY", value: c ? c.name : "", readonly: !!c, pattern: "[A-Za-z][A-Za-z0-9_.\\-]{0,63}", title: "A letter, then letters, digits, _ . or -" })
    // A key is typed once and never shown again. It is not a password of this site, so password managers leave it alone.
    const value = h("input", { class: "input font-mono", type: "password", name: "value", autocomplete: "off", spellcheck: "false", required: true, "data-1p-ignore": true, "data-lpignore": "true", "data-bwignore": true, placeholder: c && c.hasKey ? "•••••••••••• set" : "" })
    const save = h("button", { class: "btn", type: "submit" }, "Save")
    const cancel = h("button", { class: "btn", "data-variant": "ghost", type: "button", onclick: () => ((panel.hidden = true), panel.replaceChildren()) }, "Cancel")
    const remove = c && c.hasKey ? h("button", { class: "btn", "data-variant": "outline", type: "button" }, "Remove") : null
    if (remove)
      remove.onclick = async () => {
        const by = usedBy(c)
        const what = c.incoming
          ? "Rows sent to its webhook are refused until a new secret is saved."
          : by.length
            ? `${words(by)} ${by.length === 1 ? "stops" : "stop"} at ${by.length === 1 ? "its" : "their"} next call, until a new key is saved. Nothing that was already bought is lost.`
            : "No workflow uses it now. Nothing that was already bought is lost."
        if (!(await fb.confirm({ title: `Remove ${c.name}?`, text: what, yes: "Remove", tone: "bad" }))) return
        fb.act(remove, async () => {
          await call("set-key", { name: c.name, value: "" })
          await fb.redraw()
          fb.say(`Removed: ${c.name}.`)
        })
      }
    const form = h("form", { class: "card max-w-xl", "data-size": "sm", "aria-labelledby": "k-add" },
      h("header", {}, h("h2", { id: "k-add" }, c ? `${c.hasKey ? "Change" : "Add"} ${c.label}` : "Add connection")),
      h("section", { class: "flex flex-col gap-4" },
        ui.field("Name", name, c ? null : "Your workflows use it by this name."),
        ui.field(c && c.incoming ? "Secret" : "Key", value, c && c.hint ? c.hint : null),
        h("div", { class: "actions" }, save, remove, cancel),
        h("p", { class: "text-muted-foreground" }, "No check; a wrong key shows when a run fails.")))
    form.onsubmit = (e) => {
      e.preventDefault()
      const n = name.value.trim()
      if (!c && connections.some((x) => x.name === n && x.hasKey)) return fb.trouble(`${n} is already here. Use Change on its line.`)
      fb.act(save, async () => {
        await call("set-key", { name: n, value: value.value })
        await fb.redraw()
        fb.say(`Saved: ${n}.`)
      })
    }
    panel.replaceChildren(form)
    panel.hidden = false
    ;(c ? value : name).focus()
  }

  const add = may ? h("button", { class: "btn", type: "button", onclick: () => open(null) }, "Add connection") : null
  const state = (c) => (c.hasKey ? ui.status("done", "Set") : c.without ? ui.status("idle", "Not needed here") : ui.status("failed", "Missing", "bad"))
  const use = (c) => {
    const by = usedBy(c)
    if (c.incoming) return `Signs the ${c.cards[0]} webhook`
    return by.length ? words(by) : "No workflow yet"
  }
  const line = (c) => [
    h("td", { class: "wrap" },
      h("div", { class: "font-medium" }, c.label),
      c.label !== c.name ? h("code", { class: "text-muted-foreground block" }, c.name) : null,
      h("span", { class: "text-muted-foreground block sm:hidden" }, use(c)),
      c.without && !c.hasKey ? h("span", { class: "text-muted-foreground block" }, c.without) : null),
    h("td", { class: "wrap max-sm:hidden" }, use(c)),
    h("td", { class: "align-top" },
      state(c),
      may ? h("div", { class: "pt-1.5" }, h("button", { class: "btn", "data-variant": "outline", "data-size": "sm", type: "button", "aria-label": `${c.hasKey ? "Change" : "Add"} ${c.name}`, onclick: () => open(c) }, c.hasKey ? "Change" : "Add")) : null),
  ]
  const table = connections.length ? ui.table(["Service", "Used by", "Status"], connections.map(line), { label: "Connections" }) : null
  // On a phone "Used by" sits under the name, not in a column of its own.
  table?.querySelectorAll("th")[1].classList.add("max-sm:hidden")
  view.replaceChildren(...[
    head,
    add ? h("div", { class: "actions" }, add) : null,
    panel,
    table ||
      h("p", { class: "text-muted-foreground" }, "No connections yet. Add the first one a workflow needs."),
    !may && !fb.embedded ? h("p", { class: "text-muted-foreground" }, "Only an Admin or Owner adds or changes keys.") : null,
  ].filter(Boolean))
})
</script>
