<div data-view></div>
<script>
// Agents: how to connect each kind of agent (an address or a command, with Copy), then the connected agents, whose
// each is, when it was last used, and Remove. You see and remove your own; Admins and Owners see everyone's.
fb.page("/connect", async (root) => {
  const { h, call, ui } = fb
  const view = root.querySelector("[data-view]")
  const head = ui.head({ title: "Agents", sub: "The agents that talk to Flowbound for you. Each acts as its person and can never do more." })
  const copy = (text, what) => {
    const b = h("button", { class: "btn", "data-variant": "outline", "data-size": "sm", type: "button", "aria-label": `Copy ${what}` }, ui.icon("copy"), "Copy")
    b.onclick = () => fb.act(b, async () => (await fb.copy(text), fb.say("Copied.")))
    return b
  }
  const way = (who, how, text, what) => [
    h("td", { class: "wrap align-top" }, h("div", { class: "font-medium" }, who), h("span", { class: "text-muted-foreground block" }, how)),
    h("td", { class: "wrap align-top" }, h("div", { class: "flex flex-wrap items-center gap-2" }, h("code", { class: "wrap-anywhere" }, text), copy(text, what))),
  ]
  const table = (rows, label) => {
    const t = ui.table(["", ""], rows, { label })
    t.querySelector("thead").remove()
    return t
  }

  if (!fb.live) {
    // On your own computer: the agent apps here use the Flowbound plugin, and nobody signs in.
    return view.replaceChildren(
      head,
      h("section", { class: "flex flex-col gap-2" },
        h("h2", {}, "Connect an agent"),
        table([
          way("Claude Code, Codex", "Already set up in this folder. To use this computer again after connecting to a company, run once in a terminal", "npx flowbound connect --local", "the command"),
          way("Claude, ChatGPT", "Chat apps connect to a live Flowbound. Make one with", "npx flowbound deploy", "the command"),
        ], "Connect an agent")),
      h("section", { class: "flex flex-col gap-2" },
        h("h2", {}, "Connected"),
        h("p", { class: "text-muted-foreground" }, "On your own computer agents need no sign-in: every agent here acts as you.")))
  }

  const all = await call("tokens")
  const address = `${fb.url}/mcp`
  const remove = (t) => {
    const b = h("button", { class: "btn", "data-variant": "outline", "data-size": "sm", type: "button", "aria-label": `Remove ${t.label}, for ${t.person}` }, "Remove")
    b.onclick = async () => {
      if (!(await fb.confirm({ title: `Remove ${t.label}?`, text: `It stops working for ${t.mine ? "you" : t.person} at once. To use it again, connect it again.`, yes: "Remove", tone: "bad" }))) return
      fb.act(b, async () => (await call("drop-token", { id: t.id }), await fb.redraw(), fb.say(`Removed: ${t.label}.`)))
    }
    return b
  }
  view.replaceChildren(
    head,
    h("section", { class: "flex flex-col gap-2" },
      h("h2", {}, "Connect an agent"),
      table([
        way("Claude, ChatGPT", "Add this address as a connector, then sign in", address, "the address"),
        way("Claude Code, Codex", "Run once in a terminal", `npx flowbound connect ${fb.url}`, "the command"),
      ], "Connect an agent")),
    h("section", { class: "flex flex-col gap-2" },
      h("h2", {}, "Connected"),
      all.length
        ? ui.table(["Agent", "For", "Last used"], all.map((t) => [
            h("td", { class: "wrap align-top font-medium" }, t.label),
            h("td", { class: "wrap align-top" }, t.mine ? "You" : t.person),
            h("td", { class: "align-top" }, t.usedAt ? h("span", { title: new Date(t.usedAt).toLocaleString() }, fb.ago(t.usedAt)) : "never", fb.supports("drop-token") ? h("div", { class: "pt-1.5" }, remove(t)) : null),
          ]), { label: "Connected agents" })
        : h("p", { class: "text-muted-foreground" }, "No agents connected yet.")),
  )
})
</script>
