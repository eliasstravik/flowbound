<div data-view></div>
<script>
fb.page("/people", async (root, params) => {
  const { h, call, ui } = fb
  const view = root.querySelector("[data-view]")
  const RIGHTS = { none: "nothing yet", viewer: "Viewer", member: "Member", admin: "Admin", owner: "Owner" }
  const shown = Math.max(50, Math.floor(Number(params.history)) || 50)
  const [p, history] = await Promise.all([call("people"), call("history", { limit: shown })])
  const WORDS = { maxUsd: (x) => `stop at $${x}`, maxCalls: (x) => `stop at ${x} calls`, maxUsdPerRun: (x) => `${fb.money(Number(x))} a run`, maxUsdPerMonth: (x) => `${fb.money(Number(x))} a month`, until: (x) => `until ${x}` }
  const say = (v) => (v == null ? "" : typeof v === "string" ? v : Object.entries(v).filter(([k, x]) => x != null && k !== "yes").map(([k, x]) => (WORDS[k] ? WORDS[k](x) : `${k} ${x}`)).join(", "))
  const when = (iso) => new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })
  const line = (l) => h("li", { class: "flex flex-col gap-0.5 border-b py-2.5 wrap-anywhere" },
    h("div", {}, h("span", { class: "font-medium" }, `${l.what}: ${l.on}`), l.before != null ? `  ${say(l.before)} → ${say(l.after) || "nothing"}` : l.after != null ? `  ${say(l.after)}` : ""),
    h("div", { class: "sub" }, `${l.who}, through ${l.through === "page" ? "a page" : l.through} · `, h("time", { datetime: l.when }, when(l.when))))
  const download = h("button", { class: "btn", "data-variant": "outline", "data-size": "sm", type: "button" }, ui.icon("download"), "Download CSV")
  download.onclick = () =>
    fb.act(download, async () => {
      const { save } = await call("history", { csv: true })
      const a = h("a", { href: URL.createObjectURL(new Blob([save.text], { type: "text/csv" })), download: save.name })
      a.click()
    })
  const historyPart = h("section", { class: "flex max-w-2xl flex-col gap-2" },
    h("div", { class: "flex flex-wrap items-center justify-between gap-2" }, h("h2", {}, "Who changed what"), fb.embedded ? null : download),
    h("p", { class: "text-muted-foreground" }, "Kept as it was written: a line cannot be changed or deleted."),
    history.length ? h("ul", { class: "border-t", role: "list" }, ...history.map(line)) : h("p", { class: "text-muted-foreground" }, "Nothing has been changed yet."),
    history.length >= shown ? h("div", { class: "actions pt-2" }, h("span", { class: "text-muted-foreground" }, `The latest ${shown}.`), h("button", { class: "btn", "data-variant": "outline", "data-size": "sm", type: "button", onclick: () => fb.stay({ history: shown + 50 }) }, "Show more")) : null)
  if (p.signIn === "off") return view.replaceChildren(ui.head({ title: "People", sub: "This Flowbound runs on your own computer: nobody signs in, and everything is done as you." }), historyPart)

  const change = async (email, rights, el) => {
    // Taking someone out, or handing over everything, is asked once more: neither is a slip of the thumb.
    if (rights === "remove" && !(await fb.confirm({ title: `Remove ${email} from Flowbound?`, text: "They can no longer come in, and agents connected as them stop working.", yes: "Remove", tone: "bad" }))) return fb.redraw()
    if (["admin", "owner"].includes(rights) && !(await fb.confirm({ title: `Make ${email} an ${RIGHTS[rights]}?`, text: "They will be able to manage keys and people.", yes: "Change role" }))) return fb.redraw()
    await fb.act(el, async () => {
      try {
        await (rights === "remove" ? call("remove-person", { email }) : call("set-rights", { email, rights }))
        fb.say(rights === "remove" ? `Removed: ${email}.` : `${email}: ${RIGHTS[rights]}.`)
      } finally {
        await fb.redraw()
      }
    })
  }
  const rightsOf = (x) => {
    const mine = x.email && x.setBy === "a manager" && x.email !== p.you && (p.isOwner || !["admin", "owner"].includes(x.rights))
    if (!p.canManage || !mine) return h("div", {}, x.rights === "removed" ? "removed" : RIGHTS[x.rights], x.setBy !== "a manager" ? h("div", { class: "sub" }, `set by ${x.setBy}`) : null)
    return h("select", { class: "select w-full max-w-52", name: `rights-${x.email}`, "aria-label": `Rights for ${x.email}`, onchange: (e) => change(x.email, e.target.value, e.target) },
      ...Object.entries(RIGHTS).filter(([k]) => p.isOwner || !["admin", "owner"].includes(k)).map(([k, v]) => h("option", { value: k, selected: x.rights === k }, v)),
      x.rights === "removed" ? h("option", { value: "removed", selected: true, disabled: true }, "removed") : h("option", { value: "remove" }, "remove from Flowbound"))
  }
  const person = (x) => [
    h("td", { class: "wrap w-3/5 align-top" }, h("div", { class: "font-medium" }, x.name), x.email && x.email !== x.name ? h("div", { class: "sub" }, x.email) : x.email ? null : h("div", { class: "sub" }, "team password, name not checked"), h("div", { class: "sub" }, x.lastSeen === "never" ? "has not signed in yet" : `last signed in ${x.lastSeen}`)),
    h("td", { class: "wrap align-top" }, rightsOf(x)),
  ]
  const email = h("input", { class: "input", name: "email", type: "email", placeholder: "name@company.com", autocomplete: "off", required: true })
  const addBtn = h("button", { class: "btn", type: "submit" }, "Add as Viewer")
  const add = p.canManage && p.rightsFrom === "managers"
    ? h("form", { class: "card max-w-2xl", "data-size": "sm", "aria-labelledby": "p-add", onsubmit: (e) => (e.preventDefault(), p.people.some((x) => x.email === email.value.trim().toLowerCase()) ? fb.trouble(`${email.value.trim()} is already here. Change their rights in the list.`) : change(email.value, "viewer", addBtn)) },
        h("header", {}, h("h2", { id: "p-add" }, "Add a person")),
        h("section", { class: "flex flex-col gap-4" }, ui.field("Work email", email, "They sign in with the same work login. You can also wait: everyone who signs in shows up here with nothing, until you give them rights."), h("div", { class: "actions" }, addBtn)))
    : null
  view.replaceChildren(
    ...[
      ui.head({ title: "People", sub: `People sign in with ${p.signIn}. Signing in gives nothing by itself: ${p.rightsFrom === "groups" ? "each person's rights come from their groups in the login." : "a manager gives each person their rights."}`,
        actions: fb.embedded && fb.can("admin") ? [ui.link("/people", {}, "Manage people on the web", { class: "btn", "data-variant": "outline", "data-web": true })] : [] }),
      h("p", { class: "text-muted-foreground max-w-2xl" }, "Viewers can look. Members can save, run and publish workflows. Admins also manage people, keys and settings. Owners can do everything, including deleting the project."),
      h("div", { class: "max-w-2xl" }, ui.table(["Person", "May"], p.people.map(person), { label: "People" })),
      add,
      historyPart,
    ].filter(Boolean))
})
</script>
